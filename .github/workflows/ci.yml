name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r frontend/requirements.txt
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t beat-the-crowd .
      - name: Image runs and prints its commands
        run: docker run --rm beat-the-crowd --help
      - name: Run backend tests inside the image
        run: docker run --rm --entrypoint pytest beat-the-crowd -q
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t beat-the-crowd-frontend .
      - name: Verify container health and real model prediction
        run: |
          docker run -d --name api -p 8080:8080 beat-the-crowd
          trap 'docker logs api; docker rm -f api' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 2
          done
          docker exec api python scripts/smoke_test.py --api-url http://localhost:8080
      - name: Verify frontend container starts
        run: |
          docker run -d --name frontend -p 8501:8080 -e API_URL=http://127.0.0.1:8080 beat-the-crowd-frontend
          trap 'docker logs frontend; docker rm -f frontend' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
